openapi: 3.1.0
info:
  title: say API
  version: 0.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    HTTP API of the say core. Realtime traffic (WebSocket, SSE) uses the
    envelope defined in envelope.schema.json. This file is the source of
    truth for sdk/ts and sdk/py.

    Every route except /health, /setup and /login needs an access token,
    sent as `Authorization: Bearer <token>` or, for browsers, in the
    `say_token` cookie. People get the cookie from POST /setup or
    POST /login; agents get a token from POST /principals or
    `say principal add`. Request bodies must be `application/json`.

    Realtime: every event has a per-room `seq`. A client keeps the last
    `seq` it has seen per room (its cursor) and resumes from it after a
    reconnect, over the WebSocket (`subscribe` with `after`), SSE
    (`Last-Event-ID` or `?after=`) or long polling
    (`GET /rooms/{id}/events?after=…&wait=…`).
servers:
  - url: /api/v1
security:
  - bearer: []
  - cookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and version
      security: []
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /setup:
    get:
      operationId: getSetup
      summary: Whether the instance still needs its first admin
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: setup
      summary: Create the first admin and sign them in
      description: |
        Works once per instance. `code` is the setup code the server logs
        at startup (or `--setup-code`). On success the response sets the
        `say_token` session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Setup"
      responses:
        "201":
          description: The new admin, signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /login:
    post:
      operationId: login
      summary: Sign in with a username and password
      description: Sets the `say_token` session cookie, valid for 30 days.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: The signed-in principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /logout:
    post:
      operationId: logout
      summary: Revoke the token this request was made with
      description: Also clears the `say_token` cookie.
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Error"
  /principals:
    get:
      operationId: listPrincipals
      summary: Every principal on the instance, oldest first
      description: |
        The directory clients resolve sender and member names from. People
        and agents may read it; guests and ghosts get 403.
      responses:
        "200":
          description: The principals
          content:
            application/json:
              schema:
                type: object
                required: [principals]
                properties:
                  principals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createPrincipal
      summary: Add a person or an agent (instance admins only)
      description: |
        A human gets a username and password and signs in through
        /login. An agent gets an access token that never expires; it is
        returned here once and cannot be shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrincipal"
      responses:
        "201":
          description: The new principal, and the agent's token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPrincipal"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: The principal the token belongs to
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Error"
  /rooms:
    get:
      operationId: listRooms
      summary: Rooms the caller is a member of, oldest first
      responses:
        "200":
          description: The rooms
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRoom
      summary: Create a room owned by the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoom"
      responses:
        "201":
          description: The new room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /rooms/{id}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      operationId: getRoom
      summary: One room
      responses:
        "200":
          description: The room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateRoom
      summary: Change a room's agent settings
      description: |
        Only people (not agents) who own or administer the room, or
        instance admins who are in it, may change it, so an agent can
        never lift its own limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoom"
      responses:
        "200":
          description: The room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /rooms/{id}/members:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      operationId: listMembers
      summary: Members of a room
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: addMember
      summary: Add a principal to a room (owners and admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMember"
      responses:
        "201":
          description: The new membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /rooms/{id}/members/{principal_id}:
    parameters:
      - $ref: "#/components/parameters/RoomID"
      - name: principal_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateMember
      summary: Make an agent a designated responder, or stop it being one
      description: |
        A built-in agent that is a responder answers every message in the
        room, not only those that mention it. Only people who own or
        administer the room, or instance admins in it, may change it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMember"
      responses:
        "200":
          description: The membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /rooms/{id}/events:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      operationId: listEvents
      summary: Page through a room's event log
      description: |
        With `after`, reads forward from that cursor; `wait` then holds the
        request until at least one event arrives or the wait ends (the
        long-poll fallback). Without `after`, reads the page that ends
        just before `before`, or the latest page. Events are always in seq
        order.
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: before
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: wait
          in: query
          description: Seconds to wait for new events; only with `after`.
          schema:
            type: integer
            minimum: 0
            maximum: 60
            default: 0
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /rooms/{id}/events/stream:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    get:
      operationId: streamEvents
      summary: Server-Sent Events of a room
      description: |
        Replays the events after the cursor, then streams new ones. Each
        SSE message has `event: event`, `id: <seq>` and the Event as JSON
        in `data`. Idle streams get a `: ping` comment every 25 seconds.
      parameters:
        - name: after
          in: query
          description: Cursor to start after. Defaults to `Last-Event-ID`, then 0.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: An event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /rooms/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/RoomID"
    post:
      operationId: sendMessage
      summary: Send a message to a room
      parameters:
        - name: Idempotency-Key
          in: header
          description: |
            A repeated key from the same sender in the same room returns the
            original event with status 200 instead of sending again.
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "201":
          description: The new event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "200":
          description: The event an earlier send with the same key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Agents are paused in this room (code agents_paused)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          description: |
            An automated sender hit the room's agent turn budget (code
            agent_budget) or its own rate limit (code rate_limited).
          headers:
            Retry-After:
              description: Seconds until the send would pass.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ws:
    get:
      operationId: openWebSocket
      summary: The client and connector WebSocket
      description: |
        Frames are envelopes (envelope.schema.json). A request carries a
        client-chosen `id`, a `type` and a payload; the reply echoes `id`
        and `type` with `status` `ok` or `error` (payload `WsError`).
        Request types and payloads:

        - `subscribe`: `WsSubscribe`. Pushes the room's events after
          `after`, then new ones. Subscribing again restarts from the new
          cursor.
        - `unsubscribe`: `WsUnsubscribe`.
        - `send`: `WsSend`; the reply payload is the `Event`.
        - `ping`: no payload.

        Events arrive as pushes `{id: <event id>, type: "event", payload:
        Event}` without a status. A push `{id, type: "rooms"}` without a
        payload says the caller's room list changed (it was added to a room
        or created one); reread `GET /rooms`. Like event notifications it
        is a hint, so also reread the list after reconnecting. A client that falls too far behind is
        closed with code 1008 and should reconnect and resubscribe from its
        cursors.
      responses:
        "101":
          description: Switching to the WebSocket protocol
        "401":
          $ref: "#/components/responses/Error"
  /builtin-agents:
    get:
      operationId: listBuiltinAgents
      summary: Built-in agents (instance admins only)
      description: |
        Agents the server runs itself by calling a model provider. API
        keys are never returned.
      responses:
        "200":
          description: The built-in agents, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/BuiltinAgent"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createBuiltinAgent
      summary: Add a built-in agent (instance admins only)
      description: |
        Creates an agent principal that the server runs. Add it to rooms
        like any other principal; it answers DMs, mentions, and every
        message in rooms where it is a responder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBuiltinAgent"
      responses:
        "201":
          description: The new agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuiltinAgent"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /builtin-agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The agent's principal id
        schema:
          type: string
    patch:
      operationId: updateBuiltinAgent
      summary: Change a built-in agent (instance admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuiltinAgentSettings"
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuiltinAgent"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: say_token
  parameters:
    RoomID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: An error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable code: unauthorized, forbidden,
                not_found, conflict, bad_request, unsupported_media_type,
                invalid, hop_limit, agents_paused, agent_budget,
                rate_limited, too_many, invalid_credentials,
                bad_setup_code, setup_done, username_taken or internal.
            message:
              type: string
    PrincipalKind:
      type: string
      enum: [human, agent, guest, ghost, system]
    Principal:
      type: object
      required: [id, kind, display_name, created_at]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/PrincipalKind"
        display_name:
          type: string
        admin:
          type: boolean
          description: Present and true for instance admins.
        created_at:
          type: string
          format: date-time
    SetupStatus:
      type: object
      required: [needed]
      properties:
        needed:
          type: boolean
    Username:
      type: string
      description: 1–32 of a-z, 0-9, '.', '_' or '-'; case-insensitive.
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$"
    Password:
      type: string
      minLength: 8
    Setup:
      type: object
      required: [code, username, password]
      additionalProperties: false
      properties:
        code:
          type: string
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          type: string
          description: Defaults to the username.
        password:
          $ref: "#/components/schemas/Password"
    Login:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
    CreatePrincipal:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [human, agent]
        display_name:
          type: string
          description: Required for agents; defaults to the username for humans.
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
    CreatedPrincipal:
      type: object
      required: [principal]
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
        token:
          type: string
          description: The agent's access token. Only for agents.
    RoomKind:
      type: string
      enum: [dm, group, channel, widget-thread]
    Room:
      type: object
      required: [id, kind, name, agents, created_at]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/RoomKind"
        name:
          type: string
        agents:
          $ref: "#/components/schemas/AgentPolicy"
        created_at:
          type: string
          format: date-time
    AgentPolicy:
      type: object
      description: |
        The limits on automated senders (agents) that apply in a room,
        with the server's defaults filled in. People are never limited.
      required: [paused, max_hop_count, turn_limit, turn_window_seconds, rate_limit_per_minute]
      properties:
        paused:
          type: boolean
          description: Every automated send is refused with agents_paused.
        max_hop_count:
          type: integer
          description: The longest automated causation chain (hop_limit).
        turn_limit:
          type: integer
          description: |
            Automated messages, from all agents together, the room takes in
            any turn_window_seconds (agent_budget).
        turn_window_seconds:
          type: integer
        rate_limit_per_minute:
          type: integer
          description: Messages one agent may send per minute (rate_limited).
    UpdateRoom:
      type: object
      additionalProperties: false
      properties:
        agents:
          $ref: "#/components/schemas/AgentPolicyPatch"
    AgentPolicyPatch:
      type: object
      description: Absent fields stay as they are; a zero limit means the server default.
      additionalProperties: false
      properties:
        paused:
          type: boolean
        max_hop_count:
          type: integer
          minimum: 0
          maximum: 64
        turn_limit:
          type: integer
          minimum: 0
          maximum: 10000
        turn_window_seconds:
          type: integer
          description: 0, or from 60 to 86400.
          minimum: 0
          maximum: 86400
        rate_limit_per_minute:
          type: integer
          minimum: 0
          maximum: 600
    CreateRoom:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [dm, group, channel]
        name:
          type: string
          maxLength: 200
    Role:
      type: string
      enum: [owner, admin, member, observer]
    Member:
      type: object
      required: [principal_id, role, scopes]
      properties:
        principal_id:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        scopes:
          type: array
          description: responder marks an agent that answers every message in the room.
          items:
            type: string
    AddMember:
      type: object
      required: [principal_id]
      additionalProperties: false
      properties:
        principal_id:
          type: string
        role:
          type: string
          enum: [admin, member, observer]
          default: member
    UpdateMember:
      type: object
      additionalProperties: false
      properties:
        responder:
          type: boolean
          description: Only agents can be responders.
    LLMProvider:
      type: string
      description: openai also covers any OpenAI-compatible endpoint, such as Ollama.
      enum: [anthropic, openai]
    BuiltinAgentSettings:
      type: object
      description: Absent fields stay as they are.
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/LLMProvider"
        base_url:
          type: string
          description: An OpenAI-compatible endpoint, e.g. http://localhost:11434/v1. Empty is the provider's own API.
          maxLength: 2000
        model:
          type: string
          description: Empty picks the provider's default model.
          maxLength: 2000
        api_key:
          type: string
          description: Write-only. Empty uses the server's ANTHROPIC_API_KEY or OPENAI_API_KEY.
          maxLength: 2000
        system_prompt:
          type: string
          description: Added to the instructions the server gives every built-in agent.
          maxLength: 20000
        max_tokens:
          type: integer
          description: The longest reply, in tokens. 0 is the default, 1024.
          minimum: 0
          maximum: 64000
        daily_token_budget:
          type: integer
          format: int64
          description: Input plus output tokens per UTC day; 0 is no limit.
          minimum: 0
        enabled:
          type: boolean
    CreateBuiltinAgent:
      allOf:
        - $ref: "#/components/schemas/BuiltinAgentSettings"
        - type: object
          required: [display_name, provider]
          properties:
            display_name:
              type: string
              maxLength: 100
    BuiltinAgent:
      type: object
      required: [principal, provider, base_url, model, has_api_key, system_prompt, max_tokens, daily_token_budget, tokens_today, enabled]
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
        provider:
          $ref: "#/components/schemas/LLMProvider"
        base_url:
          type: string
        model:
          type: string
        has_api_key:
          type: boolean
        system_prompt:
          type: string
        max_tokens:
          type: integer
        daily_token_budget:
          type: integer
          format: int64
        tokens_today:
          type: integer
          format: int64
          description: Tokens used so far today (UTC).
        enabled:
          type: boolean
        last_error:
          type: string
          description: Why the agent last failed to reply, until it next succeeds.
        last_error_at:
          type: string
          format: date-time
    Reachability:
      type: string
      enum: [live, offline, unlinked]
    Causation:
      type: object
      required: [hop_count]
      properties:
        caused_by:
          type: string
          description: Id of the event that triggered this one.
        hop_count:
          type: integer
          minimum: 0
          description: Automated hops since the last human event.
    EventType:
      type: string
      enum: [message, edit, reaction, typing, receipt]
    StreamState:
      type: string
      enum: [streaming, final]
    PartKind:
      type: string
      enum: [text, attachment, tool-call, tool-result, card]
    Part:
      type: object
      description: |
        One typed piece of a message. `data` is a JSON object of at most
        64 KiB; for `text` it is a `TextPartData`.
      required: [kind, data]
      properties:
        kind:
          $ref: "#/components/schemas/PartKind"
        data:
          type: object
          additionalProperties: true
    TextPartData:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
    Event:
      type: object
      required: [id, room_id, seq, type, sender_id, causation, parts, created_at]
      properties:
        id:
          type: string
        room_id:
          type: string
        seq:
          type: integer
          format: int64
          description: Position in the room's log; the cursor to resume from.
        type:
          $ref: "#/components/schemas/EventType"
        sender_id:
          type: string
        causation:
          $ref: "#/components/schemas/Causation"
        parts:
          type: array
          items:
            $ref: "#/components/schemas/Part"
        stream:
          $ref: "#/components/schemas/StreamState"
        created_at:
          type: string
          format: date-time
    SendMessage:
      type: object
      required: [parts]
      additionalProperties: false
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/Part"
        caused_by:
          type: string
          description: |
            The event in this room this message replies to. Automated
            senders must set it; a reply that would pass the hop limit is
            rejected with code hop_limit.
    WsSubscribe:
      type: object
      required: [room_id]
      properties:
        room_id:
          type: string
        after:
          type: integer
          format: int64
          minimum: 0
          default: 0
    WsUnsubscribe:
      type: object
      required: [room_id]
      properties:
        room_id:
          type: string
    WsSend:
      type: object
      required: [room_id, parts]
      properties:
        room_id:
          type: string
        idempotency_key:
          type: string
          maxLength: 200
        parts:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/Part"
        caused_by:
          type: string
    WsError:
      type: object
      required: [code, message, status]
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
          description: The HTTP status the same error would have.
        retry_after:
          type: integer
          description: For agent_budget and rate_limited, seconds until a send would pass.
